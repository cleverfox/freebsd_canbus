#!/bin/sh
#
# release/arm64/SOQUARTZ.conf
#
# FreeBSD release(7) embedded-image config for the Pine64 SOQuartz (RK3566)
# compute module on the Model A carrier board.  Modeled on ROCKPRO64.conf
# (same Rockchip boot chain: idbloader.img @ LBA 64 + u-boot.itb @ LBA 16384).
#
# Build with:
#   cd /usr/src/release
#   sudo make -C /usr/src/release release \
#       TARGET=arm64 TARGET_ARCH=aarch64 \
#       KERNCONF=GENERIC \
#       EMBEDDEDBUILD=1 BUILDCONFIG=$(pwd)/../release/arm64/SOQUARTZ.conf
#
# NOTE: the SocketCAN (PF_CAN) stack ships as the loadable can.ko module that
# GENERIC already builds.  It is made boot-time-available via loader.conf in
# arm_install_uboot() below -- no custom kernel config is required.

# NOTE on the bootloader: the prebuilt u-boot-quartz64-a pkg BOOTLOOPS on the
# SOQuartz (resets at GMAC/Net init). Use a u-boot-soquartz-model-a slave port
# (see ports/u-boot-soquartz-model-a/, BOARD_CONFIG=soquartz-model-a-rk3566_defconfig).
# Building it needs the cross-toolchain as BINARY pkgs (aarch64-none-elf-gcc,
# rkbin, py311-pyelftools, ...) because the ports texinfo/binutils deps hit a
# perl5 issue on FreeBSD 15.
EMBEDDED_TARGET_ARCH="aarch64"
EMBEDDED_TARGET="arm64"
EMBEDDEDBUILD=1
EMBEDDEDPORTS="sysutils/u-boot-soquartz-model-a"
FAT_SIZE="50m -b 16m"
FAT_TYPE="16"
IMAGE_SIZE="5120M"
KERNEL="GENERIC"
MD_ARGS="-x 63 -y 255"
PART_SCHEME="GPT"
export BOARDNAME="SOQUARTZ"

arm_install_uboot() {
	UBOOT_DIR="/usr/local/share/u-boot/u-boot-soquartz-model-a"
	UBOOT_FILE_1="idbloader.img"
	UBOOT_FILE_2="u-boot.itb"
	chroot ${CHROOTDIR} dd if=${UBOOT_DIR}/${UBOOT_FILE_1} \
		of=/dev/${mddev} bs=512 seek=64 conv=sync
	chroot ${CHROOTDIR} dd if=${UBOOT_DIR}/${UBOOT_FILE_2} \
		of=/dev/${mddev} bs=512 seek=16384 conv=sync

	# Autoload the CAN module and force the SOQuartz Model A device tree over
	# the rk3566-quartz64-a FDT that this U-Boot publishes through EFI.
	cat >> ${CHROOTDIR}/${DESTDIR}/boot/loader.conf <<-EOF
		boot_serial="YES"
		console="comconsole,efi"
		comconsole_speed="1500000"
		can_load="YES"
		dtbfile_load="YES"
		dtbfile_type="dtb"
		dtbfile_name="/boot/dtb/rockchip/rk3566-soquartz-model-a.dtb"
	EOF

	return 0
}
